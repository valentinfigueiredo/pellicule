[package]
name = "pellicule"
version = "0.1.0"
edition = "2021"
description = "Rassemble toutes tes photos et vidéos dans un seul album, classé et renommé par date."

[dependencies]
kamadak-exif = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.17.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(not(windows))".dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console"] }
