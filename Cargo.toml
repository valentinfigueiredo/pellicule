[package]
name = "pellicule"
version = "0.3.0"
edition = "2021"
description = "Rassemble toutes tes photos et vidéos dans un seul album, classé et renommé par date."

[dependencies]
kamadak-exif = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
ureq = "3.5.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
num-bigint = "0.5.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_Security_Cryptography"] }
